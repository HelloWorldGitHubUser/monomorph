server:
  port: 8080

spring:
  datasource:
    # 单数据源配置 - 所有表合并到一个数据库
    url: jdbc:mysql://localhost:3306/gulimall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: GulimallHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
  redis:
    host: localhost
    port: 6379
  # 已移除分布式 Session，改用 Servlet 容器默认的本地 Session
  thymeleaf:
    cache: false
    prefix: classpath:/
  cache:
    type: redis
    redis:
      time-to-live: 3600000
  jackson:
    time-zone: GMT+8
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER

