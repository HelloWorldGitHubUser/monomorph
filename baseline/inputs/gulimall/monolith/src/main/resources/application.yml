mybatis-plus:
  # 扫描所有模块的 Mapper XML 文件
  mapper-locations:
    - classpath*:mapper/**/*.xml
    - classpath*:product/mapper/**/*.xml
    - classpath*:member/mapper/**/*.xml
    - classpath*:order/mapper/**/*.xml
    - classpath*:ware/mapper/**/*.xml
    - classpath*:coupon/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,loggers
        exclude: env,beans,threaddump,heapdump
  endpoint:
    health:
      show-details: when_authorized
logging:
  level:
    root: INFO
    io.gulimall: INFO
    io.niceseason.gulimall: INFO

seckill:
  upload:
    cron: "0 0 3 * * ?"

gulimall:
  thread:
    corePoolSize: 10
    maxPoolSize: 20
    keepAliveTime: 300

coupon:
  user:
    name: test
    age: 20

thirdparty:
  oss:
    endpoint: oss-cn-hangzhou.aliyuncs.com
    bucket: gulimall-niceseason
    access-key: test
    secret-key: test
  sms:
    host: http://dingxin.market.alicloudapi.com
    path: /dx/sendSms
    appcode: your-app-code

order:
  close-delay-minutes: 30

ware:
  lock:
    max-minutes: 30
    cleanup-interval-ms: 60000

