<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模拟支付 - 谷粒商城</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .pay-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .subtitle {
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .order-info {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 30px;
            text-align: left;
        }
        .order-info h3 {
            color: #333;
            margin-bottom: 16px;
            font-size: 16px;
            border-bottom: 1px solid #eee;
            padding-bottom: 12px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed #eee;
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .info-label {
            color: #666;
            font-size: 14px;
        }
        .info-value {
            color: #333;
            font-weight: 500;
            font-size: 14px;
            max-width: 250px;
            text-align: right;
            word-break: break-all;
        }
        .amount {
            font-size: 36px;
            color: #e4393c;
            font-weight: bold;
            margin: 20px 0;
        }
        .amount small {
            font-size: 18px;
        }
        .pay-btn {
            background: linear-gradient(135deg, #e4393c 0%, #c81623 100%);
            color: white;
            border: none;
            padding: 16px 60px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(228, 57, 60, 0.4);
            display: inline-block;
            text-decoration: none;
            margin-bottom: 16px;
        }
        .pay-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(228, 57, 60, 0.5);
        }
        .cancel-btn {
            background: #f5f5f5;
            color: #666;
            border: none;
            padding: 12px 40px;
            font-size: 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-block;
            text-decoration: none;
        }
        .cancel-btn:hover {
            background: #eee;
        }
        .notice {
            margin-top: 24px;
            padding: 16px;
            background: #fff3cd;
            border-radius: 8px;
            color: #856404;
            font-size: 13px;
            text-align: left;
        }
        .notice strong {
            display: block;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="pay-container">
        <div class="logo">🛒</div>
        <h1>模拟支付</h1>
        <p class="subtitle">谷粒商城测试支付（无需真实付款）</p>
        
        <div class="order-info">
            <h3>📋 订单信息</h3>
            <div class="info-row">
                <span class="info-label">订单编号</span>
                <span class="info-value" th:text="${orderSn}">202512271234567890</span>
            </div>
            <div class="info-row">
                <span class="info-label">商品名称</span>
                <span class="info-value" th:text="${payVo.subject}">商品名称</span>
            </div>
            <div class="info-row" th:if="${payVo.body != null && payVo.body != ''}">
                <span class="info-label">商品规格</span>
                <span class="info-value" th:text="${payVo.body}">规格信息</span>
            </div>
        </div>
        
        <div class="amount">
            <small>￥</small><span th:text="${payVo.total_amount}">0.00</span>
        </div>
        
        <div>
            <a th:href="@{/mockPay(orderSn=${orderSn})}" class="pay-btn">
                ✓ 确认支付
            </a>
        </div>
        <div>
            <a href="/memberOrder.html" class="cancel-btn">取消支付</a>
        </div>
        
        <div class="notice">
            <strong>⚠️ 测试模式说明</strong>
            这是模拟支付功能，点击"确认支付"将直接完成订单支付，不会产生任何真实交易。
            此功能仅用于开发测试，无需配置支付宝沙箱环境。
        </div>
    </div>
</body>
</html>
