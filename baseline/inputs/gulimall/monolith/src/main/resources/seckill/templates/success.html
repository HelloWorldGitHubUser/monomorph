<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>秒杀结果</title>
</head>
<body>
<main>
    <section th:if="${orderSn != null}">
        <h1>恭喜秒杀成功</h1>
        <p>订单号：<span th:text="${orderSn}"></span></p>
        <a th:href="${'/aliPayOrder?orderSn=' + orderSn}">前往支付</a>
    </section>
    <section th:if="${orderSn == null}">
        <h1>秒杀失败</h1>
        <p>活动可能已结束、库存不足或您已经参与过该商品的秒杀。</p>
        <a href="/">返回商城首页</a>
    </section>
</main>
</body>
</html>
