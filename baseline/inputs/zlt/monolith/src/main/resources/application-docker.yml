# ====================================================
# ZLT 单体应用 - Docker 环境配置
# ====================================================
# 当在 Docker 容器中运行时使用此配置
# 激活方式: SPRING_PROFILES_ACTIVE=docker

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/zlt_monolith?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_ROOT_PASSWORD:1q2w3e4r}
    
  data:
    redis:
      host: redis
      port: 6379

  elasticsearch:
    uris: http://elasticsearch:9200

# MinIO 配置（Docker 环境）
zlt:
  minio:
    endpoint: http://minio:9000
    accessKey: minioadmin
    secretKey: minioadmin
    bucketName: zlt-bucket





