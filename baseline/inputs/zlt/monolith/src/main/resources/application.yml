server:
  port: 8080

spring:
  application:
    name: zlt-monolith
  
  # 数据库配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/zlt_monolith?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 1q2w3e4r
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
  
  # Redis配置
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 5000
  
  # Elasticsearch配置 (可选，如果不启动ES可注释掉)
  elasticsearch:
    uris: http://127.0.0.1:9200

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.central.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDel
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志链路追踪
zlt:
  trace:
    enable: true
  # 审计日志配置
  audit-log:
    enabled: true
  # 数据权限配置
  datascope:
    # 是否开启数据权限（默认关闭）
    enabled: false
    # 是否打印SQL修改日志（调试用）
    enabled-sql-debug: false
    # 创建人ID字段名
    creator-id-column-name: creator_id
    # 需要进行数据权限控制的表（支持通配符*）
    include-tables:
      - SYS_USER
      - SYS_ROLE
      - SYS_MENU
      - CLIENT
      - FILE_INFO
    # 忽略的表（不进行数据权限控制）
    ignore-tables: []
  # Elasticsearch 索引配置
  elasticsearch:
    index:
      show: "*"
  # 文件服务配置
  file-server:
    type: S3
    s3:
      endpoint: http://127.0.0.1:9000
      access-key: minioadmin
      access-key-secret: minioadmin
      bucket-name: zlt-bucket
  security:
    ignore:
      urls:
        - /
        - /index.html
        - /login.html
        - /oauth2/**
        - /login
        - /actuator/**
        - /v3/api-docs/**
        - /swagger-ui/**
        - /doc.html
        - /webjars/**
        - /error
        - /api-uaa/**
        - /api-user/**
        - /api-file/**
        - /api-log/**
        - /api-search/**
        - /static/**
        - /assets/**
        - /module/**
        - /pages/**
        - /*.html
        - /*.js
        - /*.css
    auth:
      urlPermission:
        enable: true

# 日志配置
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId}] %-5level %logger{36} - %msg%n"
  level:
    com.central: DEBUG
    org.springframework.security: DEBUG

# Knife4j 文档配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    groups-order: DESC
    operationsSorter: method
    disable-swagger-default-url: true
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: AuditLogController
      paths-to-match:
        - /api-log/auditLog
    - group: ClientController
      paths-to-match:
        - /api-uaa/clients/list
        - /api-uaa/clients/{id}
        - /api-uaa/clients/all
        - /api-uaa/clients/saveOrUpdate
    - group: FileController
      paths-to-match:
        - /api-file/files-anon
        - /api-file/files
    - group: IndexController
      paths-to-match:
        - /api-search/admin/index
        - /api-search/admin/indices
    - group: LogAggregationController
      paths-to-match:
        - /api-log/requestStat
    - group: OAuthController
      paths-to-match:
        - /api-uaa/oauth/token
        - /api-uaa/oauth/remove/token
    - group: SlowQueryLogController
      paths-to-match:
        - /api-log/slowQueryLog
    - group: SysLogController
      paths-to-match:
        - /api-log/sysLog
        - /api-log/traceLog
    - group: SysMenuController
      paths-to-match:
        - /api-user/menus/**
    - group: SysRoleController
      paths-to-match:
        - /api-user/roles
        - /api-user/allRoles
        - /api-user/roles/saveOrUpdate
    - group: SysUserController
      paths-to-match:
        - /api-user/users/**
        - /api-user/users
        - /api-user/users-anon/**
    - group: TokensController
      paths-to-match:
        - /api-uaa/tokens
    - group: ValidateCodeController
      paths-to-match:
        - /api-uaa/validata/code/**

knife4j:
  enable: true
  setting:
    language: zh_CN
