syntax = "proto3";

package com.goodskill.monomorph.id.generated.proto.orderserviceimpl;

option java_multiple_files = true;
option java_package = "com.goodskill.monomorph.id.generated.proto.orderserviceimpl";

import "shared.proto";
import "order_dto.proto";

service OrderServiceImplService {
  rpc createObject(CreateObjectRequest) returns (com.goodskill.monomorph.id.shared.RefactoredObjectID);
  rpc count(CountRequest) returns (CountResponse);
  rpc deleteRecord(DeleteRecordRequest) returns (DeleteRecordResponse);
  rpc saveRecord(SaveRecordRequest) returns (SaveRecordResponse);
}

message CreateObjectRequest {
  string clientID = 1;
  ConstructorArgs constructorArgs = 2;
}

message ConstructorArgs {
  // No explicit constructor arguments exist for OrderServiceImpl.
}

message CountRequest {
  com.goodskill.monomorph.id.shared.RefactoredObjectID object_id = 1;
  int64 seckill_id = 2;
}

message CountResponse {
  int64 count = 1;
}

message DeleteRecordRequest {
  com.goodskill.monomorph.id.shared.RefactoredObjectID object_id = 1;
  int64 seckill_id = 2;
}

message DeleteRecordResponse {
  bool success = 1;
}

message SaveRecordRequest {
  com.goodskill.monomorph.id.shared.RefactoredObjectID object_id = 1;
  com.goodskill.monomorph.dto.generated.proto.orderdto.OrderDTODTO order_dto = 2;
}

message SaveRecordResponse {
  string order_id = 1;
}