syntax = "proto3";

package com.goodskill.monomorph.dto.generated.proto.result;

option java_multiple_files = true;
option java_package = "com.goodskill.monomorph.dto.generated.proto.result";

import "google/protobuf/any.proto";

message ResultDTO {
  // Static Java constants represented as enum values.
  enum ResultCode {
    SUCCESS = 0;
    FAIL = 500;
  }

  int32 code = 1;
  string msg = 2;
  google.protobuf.Any data = 3;
  int64 serialVersionUID = 4;
}
