syntax = "proto3";

package com.youlai.mall.monomorph.dto.generated.proto.skuinfodto;

option java_multiple_files = true;
option java_package = "com.youlai.mall.monomorph.dto.generated.proto.skuinfodto";

message SkuInfoDTODTO {
    int64 id = 1;
    string skuSn = 2;
    string skuName = 3;
