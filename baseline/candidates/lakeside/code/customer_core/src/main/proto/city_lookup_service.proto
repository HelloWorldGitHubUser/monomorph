syntax = "proto3";

package com.lakesidemutual.monomorph.dto.generated.proto.citylookupservice;

option java_multiple_files = true;
option java_package = "com.lakesidemutual.monomorph.dto.generated.proto.citylookupservice";

service CityLookupServiceService {
    rpc GetCitiesForPostalCode(GetCitiesForPostalCodeRequest) returns (GetCitiesForPostalCodeResponse);
}

message CityLookupServiceDTO {
    string postalCode = 1;
    repeated string cities = 2;
}

message GetCitiesForPostalCodeRequest {
    CityLookupServiceDTO dto = 1;
}

message GetCitiesForPostalCodeResponse {
    CityLookupServiceDTO dto = 1;
}